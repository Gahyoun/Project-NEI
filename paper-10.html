<style>
:root{
  --reading-accent:#4054c9; --reading-hover:#303e9f; --reading-active:#25216c;
  --reading-tint:#edf1ff; --reading-edge:#c7d2f5;
  --visual-tint:#f3f5ff; --visual-edge:#dbe2f7;
  --primary:var(--reading-accent); --primary-hover:var(--reading-hover); --primary-deep:var(--reading-active);
  --primary-10:#e8eeff; --primary-20:#c7d2f5; --primary-30:#55b4f7;
  --secondary:#6751a2; --surface-secondary:#f3effb;
  --site-gradient:linear-gradient(90deg,#55b4f7 0%,#508df5 51%,#4e4bd2 100%);
  --site-title-gradient:linear-gradient(106deg,#2d81c9 0%,#4d71dd 49%,#4b43c6 100%);
  --gnu-blue:var(--primary); --gnu-grey:#53607a; --gnu-gold:#b3a177;
  --canvas:#ffffff; --foreground:#18213a; --body:#37435e; --muted:#51607a;
  --surface:#f5f7fd; --surface-primary:var(--reading-tint);
  --hairline:#d9e0f1; --border-strong:#697895; --on-primary:#ffffff;
  --point:#d63d4a; --danger:#de3412; --warning:#ffb114;
  --success:#228738; --information:#0b78cb;
  --nei-chart-primary:var(--reading-accent); --nei-chart-secondary:#235d8f; --nei-chart-tertiary:var(--secondary);
  --nei-chart-warm:#a36324; --nei-chart-neutral:#68758b;
  --nei-chart-grid:#dce4f4; --nei-chart-track:#f0f3fb;
  --sans:"Pretendard GOV","Pretendard",-apple-system,BlinkMacSystemFont,
         "Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --gut:24px; --maxw:1360px;
}
html{min-height:100%;background:var(--surface)}
body{margin:0;color:var(--foreground);background:var(--site-gradient) top / 100% 4px no-repeat;font-family:var(--sans)}
.nei-wait .lock{visibility:hidden}
.lock{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.card{width:min(380px,100%);background:var(--canvas);border:1px solid var(--hairline);border-radius:10px;padding:28px 26px}
h1{margin:0 0 4px;font-size:20px}
.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--border-strong);border-radius:6px}
input:focus,button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
button{font:inherit;font-size:15px;font-weight:700;padding:9px 16px;border:0;border-radius:6px;background:var(--primary);color:var(--on-primary);cursor:pointer}
#msg{min-height:1.3em;margin:10px 0 0;font-size:13.5px;color:#a3260c}
</style>
