    return S.importKey("raw", raw, "AES-GCM", false, ["decrypt"]).then(function (k) {
      return S.decrypt({ name: "AES-GCM", iv: b(P.iv) }, k, b(P.ct));
    }).then(function (pt) {
      var html = new TextDecoder().decode(pt);
      return loaded.then(function () { document.open(); document.write(html); document.close(); });
    });
  }
  function unwrap(p) {
    return S.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return S.deriveKey({ name: "PBKDF2", salt: b(K.salt), iterations: K.iter, hash: "SHA-256" }, base,
        { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    }).then(function (kek) {
      return K.wraps.reduce(function (acc, w) {
        return acc.then(function (got) {
          return got || S.decrypt({ name: "AES-GCM", iv: b(w.iv) }, kek, b(w.ct))
            .then(function (r) { return new Uint8Array(r); }, function () { return null; });
        });
      }, Promise.resolve(null));
    });
  }
  var saved = null;
  try { saved = localStorage.getItem(LS); } catch (e) {}
  (saved ? show(b(saved)) : Promise.reject()).catch(function () {
    try { localStorage.removeItem(LS); } catch (e) {}
    ready();
  });
  f.addEventListener("submit", function (ev) {
    ev.preventDefault(); msg.textContent = "확인 중…";
    unwrap(pw.value.trim()).then(function (raw) {
      if (!raw) { msg.textContent = "비밀번호가 맞지 않음"; pw.select(); return; }
      try { localStorage.setItem(LS, btoa(String.fromCharCode.apply(null, raw))); } catch (e) {}
      return show(raw);
    }).catch(function () { msg.textContent = "열지 못함 — 새로고침 후 다시"; });
  });
})();
